version = 1

[env]
LANG = "en_US.UTF-8"

[[jobs]]
id = "sort-screenshots"
name = "Sort screenshots"
script = "~/scripts/sort-screenshots.sh"

    [jobs.triggers]
    login = true
    interval = 3600
    watch = ["~/Desktop"]
    calendar = [
        { hour = 4, minute = 30 },
    ]

    [jobs.env]
    PATH = "/opt/homebrew/bin:/usr/bin:/bin"
